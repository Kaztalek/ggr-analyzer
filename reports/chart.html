<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="stylesheet"
			href="../src/html/styles.css" />
		<link
			rel="stylesheet"
			href="../src/html/search.css" />
		<link
			rel="stylesheet"
			href="../src/html/dropdown.css" />
		<link
			rel="icon"
			type="image/x-icon"
			href="../assets/icons/SO.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>GGR Analyzer</title>
	</head>
	<body>
		<div
			id="app"
			v-cloak>
			<div id="content">
				<div class="legend">
					<button
						class="primary-button character-selector"
						:class="{selected: characterVisibility[ALL_CHAR_KEY]}"
						@click="characterVisibility[ALL_CHAR_KEY] = !characterVisibility[ALL_CHAR_KEY]">
						All ({{totalReplays}} games)
					</button>
					<button
						v-for="char in characterData"
						:key="char.code"
						class="primary-button character-selector"
						:class="{selected: characterVisibility[char.code]}"
						@click="characterVisibility[char.code] = !characterVisibility[char.code]"
						:style="`border-color: ${char.color}`">
						<img :src="`../assets/icons/${char.code}.png`" />
						<div>{{char.name}} ({{char.replayTotal}})</div>
					</button>
				</div>
				<div v-if="!isSeeded">
					No replays found!
					<br />
					See README.md for instructions on setting up and generating reports.
				</div>
				<template v-else>
					<div class="chart-title">
						{{chartTitle}}
						<div
							v-if="oppAkaList.length"
							class="chart-subtitle">
							AKA
							<div
								v-for="name in oppAkaList"
								:key="name"
								class="badge">
								{{name}}
							</div>
						</div>
					</div>
					<div class="chart-container">
						<canvas
							id="win-rate-chart"
							class="chart"></canvas>
					</div>
					<div class="chart-controls">
						<Dropdown
							v-model="gameDisplayCount"
							label="Game Count"
							:options="gameDisplayOptions">
						</Dropdown>
						<Dropdown
							v-model="oppId"
							label="Opponent"
							search-field="searchKey"
							:options="oppOptions">
						</Dropdown>
						<Dropdown
							v-model="oppCharCode"
							label="Opponent Character"
							:options="oppCharOptions">
						</Dropdown>
						<button
							class="primary-button reset-zoom"
							@click="resetZoom">
							Reset Zoom
						</button>
					</div>
				</template>
			</div>
		</div>

		<script src="../node_modules/chart.js/dist/chart.umd.min.js"></script>
		<script src="../node_modules/moment/min/moment.min.js"></script>
		<script src="../node_modules/hammerjs/hammer.min.js"></script>
		<script src="../node_modules/chartjs-adapter-moment/dist/chartjs-adapter-moment.min.js"></script>
		<script src="../node_modules/chartjs-plugin-zoom/dist/chartjs-plugin-zoom.min.js"></script>
		<script src="../node_modules/vue/dist/vue.global.js"></script>
		<script src="../src/html/replayData.js"></script>
		<script src="../src/html/search.js"></script>
		<script src="../src/html/dropdown.js"></script>
		<script src="../src/html/main.js"></script>
	</body>
</html>
